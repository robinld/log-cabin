<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home">
<title>Home</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #6e6e73; --line: #e5e5ea;
    --ok: #1f9d55; --warn: #c27c0e; --bad: #d1342f; --info: #2f6fdb;
    --ok-bg: #e6f6ec; --warn-bg: #fdf3e1; --bad-bg: #fdeaea; --info-bg: #e8f0fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --muted: #98989f; --line: #2c2c2e;
      --ok: #34c759; --warn: #ffb340; --bad: #ff5a52; --info: #5e9cff;
      --ok-bg: #12301c; --warn-bg: #3a2a0c; --bad-bg: #3d1513; --info-bg: #142540;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 4px 16px; }
  h1 { font-size: 34px; margin: 0; letter-spacing: -0.5px; }
  .updated { color: var(--muted); font-size: 13px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;
       color: var(--muted); margin: 22px 4px 8px; }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .name { flex: 1; min-width: 0; }
  .row .sub { color: var(--muted); font-size: 13px; }
  .row .val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .big { font-size: 22px; font-weight: 600; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .pill.ok { background: var(--ok-bg); } .pill.warn { background: var(--warn-bg); }
  .pill.bad { background: var(--bad-bg); } .pill.info { background: var(--info-bg); color: var(--info); }
  .hero { padding: 18px 16px; display: flex; align-items: center; gap: 14px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .hero .title { font-size: 24px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 14px; }
  .empty { color: var(--muted); padding: 12px 14px; }
  .feeds { display: flex; gap: 16px; justify-content: center; color: var(--muted); font-size: 13px; margin-top: 22px; }
  .feeds span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                        margin-right: 6px; background: var(--muted); vertical-align: 1px; }
  .feeds span.ok::before { background: var(--ok); } .feeds span.bad::before { background: var(--bad); }
  .feeds span.ok, .feeds span.bad { color: var(--muted); }
  #error { display: none; margin-top: 12px; }
  .tabs { display: flex; background: var(--line); border-radius: 9px; padding: 2px; margin: 0 0 16px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--text); font: inherit; font-size: 14px;
                 font-weight: 600; padding: 6px 0; border-radius: 7px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .ev { display: flex; align-items: baseline; gap: 8px; padding: 9px 12px; font-size: 15px; cursor: pointer; }
  .ev + .ev { border-top: 1px solid var(--line); }
  .ev .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .ev .src { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
             flex: none; width: 46px; color: var(--muted); }
  .ev .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.open .txt { white-space: normal; }
  .ev.new { animation: flash 2s ease-out; }
  @keyframes flash { from { background: var(--info-bg); } to { background: transparent; } }
  .s-evl { color: var(--bad) !important; } .s-yolink { color: var(--ok) !important; }
  .s-unifi { color: var(--info) !important; } .s-lutron { color: var(--warn) !important; }
  .ctl { display: flex; gap: 8px; padding: 0 14px 14px; flex-wrap: wrap; }
  .ctl input { width: 92px; flex: none; font: inherit; font-size: 18px; letter-spacing: 4px; text-align: center;
               padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  .ctl button { flex: 1; min-width: 70px; border: 0; border-radius: 10px; padding: 10px 0; font: inherit;
                font-size: 15px; font-weight: 600; background: var(--info-bg); color: var(--info); cursor: pointer; }
  .ctl button.danger { background: var(--bad-bg); color: var(--bad); }
  .ctl button:disabled { opacity: .5; }
  .ctl-msg { padding: 0 14px 12px; font-size: 13px; color: var(--muted); }
  [hidden] { display: none !important; }  /* .ctl's display: flex would otherwise win */
</style>
</head>
<body>
<main>
  <header><h1>Home</h1><span class="updated" id="updated">Loading…</span></header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-status" aria-selected="true">Status</button>
    <button role="tab" id="tab-live" aria-selected="false">Live</button>
  </nav>

  <section id="status">
  <div class="card"><div class="hero" id="alarm-hero"><span class="dot"></span><div><div class="title">Alarm</div><div class="sub">Loading…</div></div></div>
    <div class="chips" id="alarm-chips"></div>
    <form class="ctl" id="alarm-ctl" hidden autocomplete="off">
      <input id="alarm-code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
             placeholder="Code" autocomplete="off" aria-label="Alarm code">
      <button type="button" data-action="chime">Chime</button>
      <button type="button" data-action="stay">Stay</button>
      <button type="button" data-action="disarm" class="danger">Disarm</button>
    </form>
    <div class="ctl-msg" id="alarm-msg" hidden></div></div>

  <h2>Doors</h2><div class="card" id="doors"></div>
  <h2>Temperature</h2><div class="card" id="temps"></div>
  <h2>Water</h2><div class="card" id="water"></div>
  <h2>Recent activity</h2><div class="card" id="activity"></div>

  <div class="feeds" id="feeds"></div>
  </section>

  <section id="live" hidden><div class="card" id="stream"><div class="empty">Loading…</div></div></section>
  <div class="card empty bad" id="error"></div>
</main>
<script>
const DB = "/events.json";

async function sql(query) {
  const r = await fetch(DB + "?_shape=array&sql=" + encodeURIComponent(query));
  if (!r.ok) throw new Error("query failed: " + r.status);
  return r.json();
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);

function ago(t) {
  const s = Math.max(0, (Date.now() - new Date(t).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " hr ago";
  return Math.round(s / 86400) + " d ago";
}
const clock = (t) => new Date(t).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
const day = (t) => {
  const d = new Date(t), today = new Date();
  return d.toDateString() === today.toDateString() ? clock(t)
    : d.toLocaleDateString([], {weekday: "short"}) + " " + clock(t);
};
const fahrenheit = (c) => Math.round(c * 9 / 5 + 32);

// A YoLink body's state object: MQTT reports carry it in data, polls in state.
function deviceState(body) {
  const b = JSON.parse(body);
  if (b.data && typeof b.data === "object") return b.data;
  if (b.state && typeof b.state === "object") return b.state;
  return b;
}

// "%00,01,1C08,08,00,<keypad text>$" -> {leds, text}
function keypad(line) {
  const f = line.slice(4, -1).split(",");
  return {leds: parseInt(f[1], 16), text: f.slice(4).join(",").replace(/\s+/g, " ").trim()};
}

function alarmStatus(L) {
  if (L & 0x0001) return {cls: "bad", title: "ALARM"};
  if (L & 0x0004) return {cls: "info", title: "Armed (away)"};
  if (L & 0x8000) return {cls: "info", title: "Armed (stay)"};
  if (L & 0x1000) return {cls: "ok", title: "Disarmed · Ready"};
  return {cls: "warn", title: "Disarmed · Not ready"};
}

async function render() {
  const [devices, screens, activity, feeds] = await Promise.all([
    sql(`select n.device_id, n.name, n.type, l.ts, l.body
         from device_names n join log l on l.id = (
           select max(id) from log where source = 'yolink' and device_id = n.device_id)
         where n.source = 'yolink' order by n.name`),
    sql(`select received_at, body from log
         where source = 'evl' and event_type = 'keypad' and id > (select max(id) - 400 from log)
         order by id desc`),
    sql(`select ts, device_id, event_type, body from log
         where source = 'yolink' and event_name in ('Alert', 'StatusChange')
         order by id desc limit 12`),
    sql(`select l.source, l.received_at from log l
         join (select source, max(id) as id from log group by source) m on m.id = l.id`),
  ]);

  // --- Alarm: screens from the last 90 s. The keypad cycles through them.
  const recent = screens.filter((s) => Date.now() - new Date(s.received_at) < 90000);
  const now = recent.length ? keypad(recent[0].body) : null;
  const seen = new Map();
  for (const s of recent) { const k = keypad(s.body); if (!seen.has(k.text)) seen.set(k.text, k); }
  let cls = "warn", title = "No recent keypad data", sub = "";
  if (now) {
    const L = now.leds;
    ({cls, title} = alarmStatus(L));
    sub = (L & 0x0008) ? "Power OK" : "On battery power";
    if (L & 0x0020) sub += " · Chime on";
  }
  $("alarm-hero").innerHTML = `<span class="dot ${cls === "info" ? "ok" : cls}"></span>
    <div><div class="title">${esc(title)}</div><div class="sub">${esc(sub)}</div></div>`;
  const chips = [];
  for (const k of seen.values()) {
    const w = k.text.split(" ");
    if (w[0] === "FAULT") chips.push(`<span class="pill warn">Open: ${esc(w.slice(2).join(" "))}</span>`);
    else if (w[0] === "CHECK") chips.push(`<span class="pill bad">Check: ${esc(w.slice(2).join(" "))}</span>`);
    else if (w[0] === "LOBAT") chips.push(`<span class="pill bad">Low battery: ${esc(w.slice(2).join(" "))}</span>`);
  }
  $("alarm-chips").innerHTML = chips.join("");

  // --- YoLink devices
  const byType = (t) => devices.filter((d) => d.type === t);
  const names = Object.fromEntries(devices.map((d) => [d.device_id, d.name]));

  const doors = byType("DoorSensor").map((d) => {
    const s = deviceState(d.body);
    const open = s.state === "open";
    const since = s.stateChangedAt ? "since " + day(s.stateChangedAt) : "updated " + ago(d.ts);
    return `<div class="row"><div class="name">${esc(d.name)}<div class="sub">${esc(since)}</div></div>
      <div class="val"><span class="pill ${open ? "warn" : "ok"}">${open ? "Open" : "Closed"}</span></div></div>`;
  });
  $("doors").innerHTML = doors.join("") || `<div class="empty">No door sensors</div>`;

  const temps = byType("THSensor").map((d) => {
    const s = deviceState(d.body);
    const alert = s.state === "alert";
    return `<div class="row"><div class="name">${esc(d.name)}<div class="sub">${s.humidity != null ? esc(s.humidity) + "% humidity · " : ""}${esc(ago(d.ts))}</div></div>
      <div class="val"><span class="big ${alert ? "bad" : ""}">${s.temperature != null ? fahrenheit(s.temperature) + "°" : "–"}</span>
      ${alert ? `<div class="sub bad">outside limits</div>` : ""}</div></div>`;
  });
  $("temps").innerHTML = temps.join("") || `<div class="empty">No temperature sensors</div>`;

  const leaks = byType("LeakSensor");
  const wet = leaks.filter((d) => deviceState(d.body).state !== "normal");
  const water = [];
  water.push(`<div class="row"><div class="name">Leak sensors<div class="sub">${leaks.length} sensors</div></div>
    <div class="val"><span class="pill ${wet.length ? "bad" : "ok"}">${wet.length ? wet.length + " alert" : "All dry"}</span></div></div>`);
  for (const d of wet) water.push(`<div class="row"><div class="name bad">${esc(d.name)}</div><div class="val">${esc(deviceState(d.body).state)}</div></div>`);
  for (const d of byType("Switch")) {
    const s = deviceState(d.body);
    water.push(`<div class="row"><div class="name">${esc(d.name)}<div class="sub">${esc(ago(d.ts))}</div></div>
      <div class="val"><span class="pill info">${esc(s.state)}</span></div></div>`);
  }
  $("water").innerHTML = water.join("");

  const acts = activity.map((a) => {
    const s = deviceState(a.body);
    return `<div class="row"><div class="name">${esc(names[a.device_id] || a.event_type)}<div class="sub">${esc(day(a.ts))}</div></div>
      <div class="val">${esc(s.state ?? "")}</div></div>`;
  });
  $("activity").innerHTML = acts.join("") || `<div class="empty">Nothing yet</div>`;

  // --- Feed health: the alarm reports every 30 s, YoLink is polled every 30 min.
  const limits = {evl: 120, yolink: 3600, unifi: 3600, lutron: 600, lennox: 3600};
  const label = {evl: "Alarm panel", yolink: "YoLink", unifi: "UniFi", lutron: "Lutron", lennox: "Lennox"};
  $("feeds").innerHTML = feeds.map((f) => {
    const fresh = (Date.now() - new Date(f.received_at)) / 1000 < (limits[f.source] || 3600);
    return `<span class="${fresh ? "ok" : "bad"}">${esc(label[f.source] || f.source)} ${esc(ago(f.received_at))}</span>`;
  }).join("");

  $("updated").textContent = "Updated " + clock(new Date());
  $("error").style.display = "none";
}

// --- Live: new events, one line each, newest first. Repeats are dropped: the
// alarm panel keeps re-sending its keypad screens, YoLink sensors report the
// same reading, and Lutron re-sends every level when it reconnects.
const LIVE_SQL = `select id, received_at, source, event_type, event_name, device_id, body from log
  where id > :since and (
    (source = 'evl' and event_type in ('keypad', 'zone_state', 'action'))
    or (source = 'yolink' and event_name in ('Report', 'Alert', 'StatusChange'))
    or source = 'unifi'
    or (source = 'lutron' and event_type = 'OneZoneStatus')
    or (source = 'lennox' and event_name in ('zones', 'alerts')))
  order by id limit 1000`;
const LIVE_LABEL = {evl: "Alarm", yolink: "YoLink", unifi: "UniFi", lutron: "Lutron", lennox: "Lennox"};
const LIVE_KEEP = 300;
const live = {since: null, names: {}, last: {}, zones: null, lennox: {}, items: [], open: new Set()};

const titleCase = (s) => String(s).toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
const levelText = (l) => l === 0 ? "off" : l === 100 ? "on" : l + "%";
const stamp = (t) => {
  const d = new Date(t), time = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit", second: "2-digit"})
    .replace(/\s?[AP]M$/i, "");
  return d.toDateString() === new Date().toDateString() ? time : d.toLocaleDateString([], {weekday: "short"}) + " " + time;
};

// "%01,<hex>$": a bit per zone, lowest bit of the first byte is zone 1.
function openZones(line) {
  const hex = line.slice(4, -1), open = new Set();
  for (let i = 0; i < hex.length / 2; i++) {
    const b = parseInt(hex.substr(i * 2, 2), 16);
    for (let bit = 0; bit < 8; bit++) if (b & (1 << bit)) open.add(i * 8 + bit + 1);
  }
  return open;
}

// One log row -> {key, text} for the stream, or null to leave it out.
function summarize(r) {
  const name = (src, id) => live.names[src + ":" + id];
  if (r.source === "evl" && r.event_type === "keypad") {
    return {key: "evl:status", text: alarmStatus(keypad(r.body).leds).title};
  }
  if (r.source === "evl" && r.event_type === "action") return {key: null, text: r.body};
  if (r.source === "evl" && r.event_type === "zone_state") {
    const now = openZones(r.body), prev = live.zones, zone = (z) => titleCase(name("evl", z) || "Zone " + z);
    // A motion detector's zone "opens" while it sees motion.
    const word = (z, on) => /motion/i.test(zone(z)) ? (on ? " motion" : " clear") : (on ? " opened" : " closed");
    live.zones = now;
    if (!prev) return {key: "evl:zones", text: now.size ? "Open: " + [...now].map(zone).join(", ") : "All zones closed"};
    const changes = [...now].filter((z) => !prev.has(z)).map((z) => zone(z) + word(z, true))
      .concat([...prev].filter((z) => !now.has(z)).map((z) => zone(z) + word(z, false)));
    return changes.length ? {key: null, text: changes.join(", ")} : null;
  }
  if (r.source === "yolink") {
    const d = deviceState(r.body), n = name("yolink", r.device_id) || r.event_type, key = "yolink:" + r.device_id;
    if (r.event_type === "DoorSensor") return {key, text: n + (d.state === "open" ? " opened" : " closed")};
    if (r.event_type === "LeakSensor") return {key, text: n + (d.state === "normal" ? ": dry" : ": " + d.state)};
    if (r.event_type === "THSensor") {
      if (d.temperature == null) return null;
      return {key, text: `${n} ${fahrenheit(d.temperature)}°` + (d.humidity != null ? ` · ${Math.round(d.humidity)}%` : "")};
    }
    return {key, text: `${n} ${d.state ?? r.event_name}`};
  }
  if (r.source === "unifi") {
    const m = /msg="([^"]*)"/.exec(r.body);
    // "Upper Doorbell has recorded a person." -> "Upper Doorbell: person"; first sentence only.
    const text = (m ? m[1] : r.event_name || r.event_type).split(/\.\s/)[0].replace(/\.$/, "")
      .replace(/ has recorded (an? )?/, ": ");
    return {key: null, text};
  }
  if (r.source === "lutron") {
    const z = JSON.parse(r.body).Body?.ZoneStatus;
    if (!z || z.Level == null) return null;
    const id = z.href.split("/").slice(1, 3).join("/");
    return {key: "lutron:" + id, text: `${name("lutron", id) || id} ${levelText(z.Level)}`};
  }
  if (r.source === "lennox" && r.event_name === "alerts") {
    const n = JSON.parse(r.body).Data?.alerts?.meta?.numActiveAlerts;
    if (n == null) return null;
    return {key: "lennox:alerts", text: n ? `Thermostat: ${n} active alert${n > 1 ? "s" : ""}` : "Thermostat: no active alerts"};
  }
  if (r.source === "lennox") {
    // Updates can be partial, so keep each zone's latest values and describe those.
    for (const z of JSON.parse(r.body).Data?.zones || []) {
      const st = live.lennox[z.id] = live.lennox[z.id] || {period: {}};
      Object.assign(st.period, z.status?.period);
      Object.assign(st, z.status, {period: st.period});
    }
    const parts = Object.entries(live.lennox).filter(([, st]) => st.temperature != null).map(([id, st]) => {
      const sp = st.period.hsp != null ? ` · heat ${st.period.hsp} / cool ${st.period.csp}` : "";
      return `${id === "0" ? "Thermostat" : "Zone " + (+id + 1)} ${st.temperature}°${sp} · ${st.tempOperation || "?"}`;
    });
    return parts.length ? {key: "lennox:zones", text: parts.join("; ")} : null;
  }
  return null;
}

async function liveFetch() {
  if (live.since === null) {
    const [names, [{m}]] = await Promise.all([
      sql("select source, device_id, name from device_names"), sql("select max(id) as m from log")]);
    for (const n of names) live.names[n.source + ":" + n.device_id] = n.name;
    live.since = Math.max(0, (m || 0) - 4000);  // a couple of hours, to start with some history
  }
  const fresh = [];
  for (;;) {
    const r = await fetch(DB + "?_shape=array&since=" + live.since + "&sql=" + encodeURIComponent(LIVE_SQL));
    if (!r.ok) throw new Error("query failed: " + r.status);
    const rows = await r.json();
    for (const row of rows) {
      live.since = row.id;
      let s;
      try { s = summarize(row); } catch { s = null; }
      if (!s || (s.key && live.last[s.key] === s.text)) continue;
      if (s.key) live.last[s.key] = s.text;
      fresh.push({id: row.id, t: row.received_at, src: row.source, text: s.text});
    }
    if (rows.length < 1000) break;
  }
  return fresh;
}

async function renderLive() {
  const first = live.since === null, fresh = await liveFetch();
  $("updated").textContent = "Live · " + clock(new Date());
  $("error").style.display = "none";
  if (!first && !fresh.length) return;
  live.items = fresh.reverse().concat(live.items).slice(0, LIVE_KEEP);
  const isNew = new Set(first ? [] : fresh.map((i) => i.id));
  $("stream").innerHTML = live.items.map((i) => `<div class="ev${isNew.has(i.id) ? " new" : ""}${live.open.has(i.id) ? " open" : ""}" data-id="${i.id}">
    <span class="t">${esc(stamp(i.t))}</span><span class="src s-${esc(i.src)}">${esc(LIVE_LABEL[i.src] || i.src)}</span>
    <span class="txt">${esc(i.text)}</span></div>`).join("") || `<div class="empty">Nothing yet</div>`;
}
// Tap a row to see all of it.
$("stream").addEventListener("click", (e) => {
  const row = e.target.closest(".ev");
  if (!row) return;
  const id = +row.dataset.id;
  live.open.has(id) ? live.open.delete(id) : live.open.add(id);
  row.classList.toggle("open", live.open.has(id));
});

// --- Alarm actions, at /alarm where the box publishes them (not over the LAN),
// so elsewhere the controls stay hidden. The code is sent with each action and
// never kept, here or on the box.
const ALARM = "/alarm";
const CONFIRM = {stay: "Arm the alarm in Stay mode?", disarm: "Disarm the alarm?"};

async function alarmControls() {
  try {
    const r = await fetch(ALARM + "/status", {cache: "no-store"});
    $("alarm-ctl").hidden = !r.ok;
  } catch { $("alarm-ctl").hidden = true; }
}

function alarmMsg(text, cls = "") {
  $("alarm-msg").textContent = text;
  $("alarm-msg").className = "ctl-msg " + cls;
  $("alarm-msg").hidden = !text;
}

$("alarm-ctl").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-action]");
  if (!b) return;
  const action = b.dataset.action, code = $("alarm-code").value;
  if (!/^\d{4}$/.test(code)) return alarmMsg("Enter your 4-digit code first.", "bad");
  if (CONFIRM[action] && !confirm(CONFIRM[action])) return;
  const buttons = $("alarm-ctl").querySelectorAll("button");
  buttons.forEach((x) => x.disabled = true);
  try {
    const r = await fetch(ALARM + "/action", {method: "POST", headers: {"Content-Type": "application/json"},
                                              body: JSON.stringify({action, code})});
    const reply = await r.json().catch(() => ({}));
    alarmMsg(r.ok ? "Sent. The status above updates in a few seconds." : (reply.error || "Failed: " + r.status),
             r.ok ? "ok" : "bad");
    if (r.ok) setTimeout(tick, 3000);
  } catch (err) {
    alarmMsg("Couldn't reach the box: " + err.message, "bad");
  } finally {
    $("alarm-code").value = "";
    buttons.forEach((x) => x.disabled = false);
  }
});
$("alarm-ctl").addEventListener("submit", (e) => e.preventDefault());
alarmControls();

// --- Tabs. The Live tab is #live, so it can be bookmarked.
let timer = null;
const onLive = () => location.hash === "#live";

async function tick() {
  try { await (onLive() ? renderLive() : render()); }
  catch (e) { $("error").textContent = "Couldn't refresh: " + e.message; $("error").style.display = "block"; }
}

function show() {
  $("status").hidden = onLive();
  $("live").hidden = !onLive();
  $("tab-status").setAttribute("aria-selected", String(!onLive()));
  $("tab-live").setAttribute("aria-selected", String(onLive()));
  clearInterval(timer);
  tick();
  timer = setInterval(tick, onLive() ? 4000 : 15000);
}
$("tab-status").addEventListener("click", () => history.replaceState(null, "", "#") || show());
$("tab-live").addEventListener("click", () => { location.hash = "live"; });
window.addEventListener("hashchange", show);
show();
</script>
